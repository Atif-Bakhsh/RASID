name: rasid
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rasid}
      POSTGRES_USER: ${POSTGRES_USER:-rasid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - rasid-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    image: rasid-api:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rasid}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rasid}
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/database/data-source.js',
      ]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    image: rasid-api:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rasid}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rasid}
      PORT: 3000
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  rasid-pgdata:
