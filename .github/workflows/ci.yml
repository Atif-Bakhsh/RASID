name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: rasid
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rasid -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://rasid:ci-test-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:e2e
      - name: Build the production image
        run: docker build -t rasid:ci .
      - name: Boot the image with production dependencies
        run: |
          docker run --rm --network host -e NODE_ENV=test -e DATABASE_URL="$TEST_DATABASE_URL" -e JWT_SECRET=ci-test-secret-at-least-thirty-two-characters rasid:ci node node_modules/typeorm/cli.js migration:run -d dist/database/data-source.js
          docker run -d --name rasid-ci-api --network host -e NODE_ENV=test -e DATABASE_URL="$TEST_DATABASE_URL" -e JWT_SECRET=ci-test-secret-at-least-thirty-two-characters rasid:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3000/api/v1/health/ready; then exit 0; fi
            sleep 1
          done
          docker logs rasid-ci-api
          exit 1
      - name: Check patch whitespace
        run: git diff --check
