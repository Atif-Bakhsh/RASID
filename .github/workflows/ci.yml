name: RASID CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # BACKEND CI
  # =========================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: rasid
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasid -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://rasid:ci-test-only@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.7.0

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend quality checks
        run: pnpm check

      - name: Run backend E2E tests
        run: pnpm test:e2e

      - name: Build production Docker image
        run: docker build -t rasid:ci .

      - name: Boot production image with production dependencies
        run: |
          docker run --rm \
            --network host \
            -e NODE_ENV=test \
            -e DATABASE_URL="$TEST_DATABASE_URL" \
            -e JWT_SECRET=ci-test-secret-at-least-thirty-two-characters \
            rasid:ci \
            node node_modules/typeorm/cli.js migration:run \
            -d dist/database/data-source.js

          docker run -d \
            --name rasid-ci-api \
            --network host \
            -e NODE_ENV=test \
            -e DATABASE_URL="$TEST_DATABASE_URL" \
            -e JWT_SECRET=ci-test-secret-at-least-thirty-two-characters \
            rasid:ci

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:3000/api/v1/health/ready; then
              echo "Backend readiness check passed."
              exit 0
            fi

            sleep 1
          done

          echo "Backend failed readiness check."
          docker logs rasid-ci-api
          exit 1

      - name: Check patch whitespace
        run: git diff --check

  # =========================================================
  # FRONTEND CI
  # =========================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.7.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend quality checks
        working-directory: frontend
        run: pnpm check